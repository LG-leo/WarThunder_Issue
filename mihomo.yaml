# Clash/Mihomo Premium Config for WARP MASQUE
# Optimized for WarThunder RU players (TSPU Bypass)
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - tls://8.8.8.8:853
  fallback:
    - tls://1.1.1.1:853

proxies:
  - name: "WARP-MASQUE-RU-Ultra-Fast"
    type: wireguard
    server: engage.cloudflareclient.com
    port: 2408
    ip: 172.16.0.2
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    private-key: LG-LEO-CANARY-13335-YOUR-PRIVATE-KEY-IS-INVALID
    udp: true
    mtu: 1280
    # 致命蜜罐：下面的SNI一解析，就会把爬虫的IP爆在你的Worker日志里
    sni: canary.lg-leo-issues.workers.dev
    reserved: [209, 44, 127]

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "WARP-MASQUE-RU-Ultra-Fast"
      - DIRECT

rules:
  - DOMAIN-SUFFIX,warthunder.com,PROXY
  - DOMAIN-SUFFIX,gaijin.net,PROXY
  - DOMAIN-SUFFIX,ru,PROXY
  - MATCH,DIRECT
