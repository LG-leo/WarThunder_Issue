name: Track Repo Clones

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨跑
  workflow_dispatch: # 允许手动触发

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Clone Data from GitHub API
        env:
          # 这里换成了你刚才生成的具有 admin 权限的 PAT_TOKEN
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CLONE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones")
          
          # 提取数据，如果找不到字段，默认给 0
          COUNT=$(echo "$CLONE_DATA" | jq '.count // 0')
          UNIQUE=$(echo "$CLONE_DATA" | jq '.uniques // 0')
          
          # 把日期简化成 2026-10-23 这种格式
          DATE=$(date -u +"%Y-%m-%d")
          
          echo "提取到的数据: 日期=$DATE, 总克隆=$COUNT, 独立IP=$UNIQUE"
          
          # 如果文件不存在，先写表头
          if [ ! -f clone_stats.csv ]; then
            echo "Date,Total Clones,Unique Clones" > clone_stats.csv
          fi
          
          # 写入数据
          echo "$DATE, $COUNT, $UNIQUE" >> clone_stats.csv

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clone_stats.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update clone stats [skip ci]"
          git push
