name: Track Repo Clones

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点跑一次
  workflow_dispatch: # 允许手动触发

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Clone Data from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 调用 GitHub Traffic API 获取克隆数据
          CLONE_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones")
          
          # 提取具体数值（使用 jq 处理 JSON）
          COUNT=$(echo $CLONE_DATA | jq '.count')
          UNIQUE=$(echo $CLONE_DATA | jq '.uniques')
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "Date: $DATE, Total Clones: $COUNT, Unique Clones: $UNIQUE"
          
          # 把数据追加到本地文件
          echo "$DATE, $COUNT, $UNIQUE" >> clone_stats.csv

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clone_stats.csv
          git commit -m "Update clone stats [skip ci]" || echo "No changes to commit"
          git push
