[general]
server_check_url=http://cp.cloudflare.com/generate_204
network_check_url=http://www.baidu.com
dns_exclusion_list = *.warthunder.com, *.gaijin.net
dns_server = 1.1.1.1, 8.8.8.8
ipv6 = false
udp_ports = 443, 80, 2408

[policy]
static=RU_TSPU_Bypass, direct, reject, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
url-latency-benchmark=Auto_Fastest, RU_TSPU_Bypass, check-interval=600, tolerance=100

[server_local]
# 高级伪装节点 - 战雷极速专线
vless=engage.cloudflareclient.com:2408, method=none, password=LG-LEO-CANARY-QX-13335, obfs=over-tls, obfs-host=canary.lg-leo-issues.workers.dev, tls-verification=true, fast-open=false, udp-relay=true, tag=RU_TSPU_Bypass
# 备用 Trojan 伪装节点
trojan=engage.cloudflareclient.com:443, password=LG-LEO-CANARY-QX-TROJAN, over-tls=true, tls-host=canary.lg-leo-issues.workers.dev, tls-verification=true, tag=RU_TSPU_Backup

[filter_local]
# 针对战雷服务器的强力分流
host-suffix, warthunder.com, RU_TSPU_Bypass
host-suffix, gaijin.net, RU_TSPU_Bypass
geoip, ru, RU_TSPU_Bypass
final, direct

[rewrite_local]
# 阻止客户端更新失败弹窗
^https?:\/\/api\.gaijin\.net url reject-img

[mitm]
# 空置，防抓包
hostname = %APPEND% *.local
